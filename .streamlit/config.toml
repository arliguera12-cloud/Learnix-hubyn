# ═══════════════════════════════════════════════════════════════
#  .streamlit/config.toml
#  Learnix DTE Hub — Configuración Global
#  Tema: Teal Navy Pro · Modo Oscuro Corporativo
# ═══════════════════════════════════════════════════════════════

[theme]
base                     = "dark"
primaryColor             = "#568F7C"
backgroundColor          = "#000009"
secondaryBackgroundColor = "#07142B"
textColor                = "#BDD1BD"
font                     = "sans serif"

[server]
maxUploadSize        = 500
enableXsrfProtection = true
enableCORS           = false
maxMessageSize       = 200

[runner]
fastReruns = true

[browser]
gatherUsageStats = false

[ui]
hideTopBar = true
