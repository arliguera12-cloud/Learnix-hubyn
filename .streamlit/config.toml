# ═══════════════════════════════════════════════════════════════
#  .streamlit/config.toml
#  Learnix DTE Hub — Configuración Global
#  Tema: Midnight Forest Professional · Modo Oscuro
# ═══════════════════════════════════════════════════════════════

[theme]
base                   = "dark"
primaryColor           = "#5EA830"
backgroundColor        = "#080C09"
secondaryBackgroundColor = "#0D1410"
textColor              = "#E0EED8"
font                   = "sans serif"

[server]
maxUploadSize      = 500
enableXsrfProtection = true
enableCORS         = false
maxMessageSize     = 200

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
serverAddress    = "localhost"

[ui]
hideTopBar = true
